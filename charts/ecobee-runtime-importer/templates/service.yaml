apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecobee.fullname" . }}
  labels: {{- include "ecobee.labels" . | nindent 4 }}
spec:
  selector: {{- include "ecobee.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
