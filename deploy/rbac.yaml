---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecobee-runtime-importer
  namespace: ecobee-runtime-importer
---
# The importer is the single writer of the token Secret (ARCHITECTURE.md §4.2).
# Auth0 may rotate the refresh token on any refresh, and a rotated value that is
# never persisted locks the account out on the next pod restart — so this
# workload needs write access to exactly one Secret, and nothing else.
#
# `resourceNames` is what keeps that narrow. Without it, `patch` on secrets is
# patch on EVERY secret in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecobee-runtime-importer-tokens
  namespace: ecobee-runtime-importer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecobee-importer-tokens"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecobee-runtime-importer-tokens
  namespace: ecobee-runtime-importer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecobee-runtime-importer-tokens
subjects:
  - kind: ServiceAccount
    name: ecobee-runtime-importer
    namespace: ecobee-runtime-importer
