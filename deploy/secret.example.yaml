---
# EXAMPLE ONLY — not applied by kustomize, and never commit a real token.
#
# You do not normally write this file. `make secret` creates AND replaces the
# Secret from the credentials bootstrap wrote. This exists to document the shape.
#
# ⚠️ THIS SECRET IS MUTABLE STATE OWNED BY THE WORKLOAD.
#
#    Unlike every other credential Secret in this estate, it is NOT a static
#    copy of a password-manager item. Auth0 rotates the refresh token — measured,
#    not theoretical — and the importer patches the new value back here on every
#    refresh, along with the access token it just obtained.
#
#    After the first refresh the cluster's copy is authoritative and the vault's
#    copy is a dead bootstrap seed. Restoring it presents a revoked refresh token
#    and locks the account out, requiring a fresh interactive login with MFA.
#    Back it up by reading it out of the cluster, not by re-applying the vault.
#
# Keys:
#   refresh_token  REQUIRED, and the only one you supply. Rotated in place.
#   access_token   Written by the importer after its first refresh. Do NOT set it
#                  by hand: it lives about an hour, so a pasted value is stale
#                  almost immediately. Its absence is handled — the importer
#                  refreshes before its first request when none is loaded.
#   api_key        ONLY for accounts holding a legacy ecobee developer key, which
#                  use the older PIN refresh endpoint instead of Auth0. Leave it
#                  out entirely otherwise — an empty value is not the same as an
#                  absent one, and its presence changes which endpoint is used.
#
# The name must match ECOBEE_SECRET_NAME in config.env, which kustomize also
# copies into the Role's resourceNames. The namespace comes from the `namespace:`
# field in kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ecobee-importer-tokens
  namespace: ecobee-runtime-importer
type: Opaque
stringData:
  refresh_token: "REPLACE_ME"
