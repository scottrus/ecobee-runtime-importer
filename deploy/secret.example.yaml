---
# EXAMPLE ONLY — do not commit a real token.
#
# Create this from the output of scripts/bootstrap.py:
#
#   kubectl create secret generic ecobee-importer-tokens \
#     -n ecobee-runtime-importer \
#     --from-literal=refresh_token='<value from bootstrap>'
#
# ⚠️ THIS SECRET IS MUTABLE STATE OWNED BY THE WORKLOAD.
#
#    Unlike every other credential Secret in this estate, it is NOT a static
#    copy of a password-manager item. Auth0 may rotate the refresh token on any
#    refresh, and the importer patches the new value back here. After the first
#    rotation the cluster's copy is authoritative and the vault's copy is a dead
#    bootstrap seed.
#
#    Restoring this Secret from the vault will present a revoked refresh token
#    and lock the account out, requiring a fresh interactive login with MFA.
#    Back it up by reading it out of the cluster, not by re-applying the vault.
#
# Keys:
#   refresh_token  required. From bootstrap, then rotated in place.
#   access_token   optional. Written by the importer; absent on first install.
#   api_key        optional. ONLY for accounts holding a legacy developer key,
#                  which use ecobee's older PIN refresh endpoint instead of
#                  Auth0. Leave unset otherwise — an empty value is not the same
#                  as an absent one.
apiVersion: v1
kind: Secret
metadata:
  name: ecobee-importer-tokens
  namespace: ecobee-runtime-importer
type: Opaque
stringData:
  refresh_token: "REPLACE_ME"
