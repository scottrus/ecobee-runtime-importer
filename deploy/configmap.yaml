---
# Every tunable lives here rather than in the Deployment, so adapting to a
# different shape — a cluster VictoriaMetrics, another namespace, a second
# instance for a second account — is a ConfigMap edit and a rollout restart,
# with the Deployment left untouched.
#
# The container reads these with `envFrom`, so a key added here becomes an
# environment variable with no Deployment change. Full list in README.md.
#
# Environment is read once at process start, so an edit here needs:
#   kubectl rollout restart deploy/ecobee-runtime-importer -n ecobee-runtime-importer
# A restart is cheap: there is no persisted state, and the startup lookback
# re-imports recent history idempotently.
#
# ⚠️ ONE VALUE IS COUPLED OUTSIDE THIS FILE: ECOBEE_SECRET_NAME must match the
#    `resourceNames` entry in rbac.yaml. That Role is deliberately scoped to a
#    single Secret by name, so renaming the Secret here alone produces a 403 on
#    startup. The importer detects that case and logs which file to change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecobee-runtime-importer-config
  namespace: ecobee-runtime-importer
data:
  # --- credentials -------------------------------------------------------
  ECOBEE_TOKEN_STORE: "kubernetes"
  ECOBEE_SECRET_NAME: "ecobee-importer-tokens"
  # ECOBEE_SECRET_NAMESPACE is intentionally unset: it defaults to the pod's
  # own namespace. Set it only to read a Secret from a different namespace,
  # which also requires promoting the Role in rbac.yaml to a ClusterRole.

  # --- destination -------------------------------------------------------
  # Single-node VictoriaMetrics, cross-namespace, so the FQDN is required — the
  # importer runs in its own namespace and a bare service name would not resolve.
  #
  # Common alternatives:
  #   vmks single  http://vmsingle-<release>.<ns>.svc.cluster.local:8428/api/v1/import/prometheus
  #   cluster VM   http://vminsert.<ns>.svc.cluster.local:8480/insert/0/prometheus/api/v1/import/prometheus
  #   vmagent      http://vmagent.<ns>.svc.cluster.local:8429/api/v1/import/prometheus
  ECOBEE_VM_IMPORT_URL: "http://vmsingle-vmks-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/import/prometheus"
  ECOBEE_WRITE_TIMEOUT_SECONDS: "60"
  # For a destination behind authentication, mount a Secret and point at the
  # file — the value is never put in this ConfigMap:
  # ECOBEE_VM_AUTH_HEADER_FILE: "/etc/ecobee/vm-auth/authorization"

  # --- pacing ------------------------------------------------------------
  # ecobee's documented floor is 900s. Lower values are clamped, not honoured.
  ECOBEE_IMPORT_INTERVAL_SECONDS: "900"
  # Re-imported on every restart. Idempotent, and it is what removes the need
  # for any persisted watermark. Capped at the API's 31 days.
  ECOBEE_STARTUP_LOOKBACK_HOURS: "24"
  # Re-request this much before the watermark each cycle, so late-arriving and
  # revised buckets are picked up.
  ECOBEE_OVERLAP_MINUTES: "60"
  ECOBEE_THERMOSTAT_CACHE_SECONDS: "3600"

  # --- collection --------------------------------------------------------
  ECOBEE_INCLUDE_SENSORS: "true"
  # ECOBEE_EXTRA_COLUMNS adds to the default set; ECOBEE_COLUMNS replaces it
  # entirely. Undocumented-unit columns (sky, wind, dmOffset) are excluded by
  # default on purpose — verify what they mean before enabling them.
  # ECOBEE_EXTRA_COLUMNS: "sky,wind"
  # Static labels on every sample, for estates running more than one instance.
  # ECOBEE_EXTRA_LABELS: "site=kukui"

  # --- process -----------------------------------------------------------
  ECOBEE_METRICS_PORT: "9863"
  ECOBEE_LOG_LEVEL: "INFO"
