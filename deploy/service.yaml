---
apiVersion: v1
kind: Service
metadata:
  name: ecobee-runtime-importer
  namespace: ecobee-runtime-importer
  labels:
    app.kubernetes.io/name: ecobee-runtime-importer
spec:
  selector:
    app.kubernetes.io/name: ecobee-runtime-importer
  ports:
    - name: metrics
      port: 9863
      targetPort: metrics
---
# This cluster runs the VictoriaMetrics operator, so VMServiceScrape is the
# right CR; a ServiceMonitor would render against a CRD that does not exist.
#
# What is scraped here is ONLY the importer's own health. House data never
# appears on this endpoint — it is written directly to VictoriaMetrics with its
# original timestamps.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: ecobee-runtime-importer
  namespace: ecobee-runtime-importer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ecobee-runtime-importer
  endpoints:
    - port: metrics
      # 60s despite a 15-minute import interval, and that is not a mismatch:
      # scraping costs nothing, and it is what gives `up` and the staleness
      # gauges useful resolution. The gauges simply repeat between cycles.
      interval: 60s
